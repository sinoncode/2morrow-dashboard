services:
  # ── Laravel Application ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app_network
    depends_on:
      - db
      - redis

  # ── Nginx Web Server ─────────────────────────────
  webserver:
    image: nginx:alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - app_network
    depends_on:
      - app

  # ── PostgreSQL Database ──────────────────────────
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-logistics_db}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  # ── Redis (Cache, Queues, Sessions) ──────────────
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - app_network

  # ── Queue Worker ─────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "until nc -z -w 1 db 5432 && nc -z -w 1 redis 6379; do echo 'Waiting for database and redis...'; sleep 2; done; php artisan queue:work --sleep=3 --tries=3 --max-time=3600"
    volumes:
      - ./:/var/www
    networks:
      - app_network
    depends_on:
      - app
      - db
      - redis

  # ── pgAdmin (Optional – DB Management UI) ───────

# ── Volumes ──────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

# ── Networks ─────────────────────────────────────────
networks:
  app_network:
    driver: bridge
