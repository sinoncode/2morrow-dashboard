services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 2morrow-admin-app
    ports:
      - '8000:8000'
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: 2morrow
      DB_USERNAME: postgres
      DB_PASSWORD: secret
    depends_on:
      - db
    command: sh -lc "until php -r 'new PDO(\"pgsql:host=db;port=5432;dbname=2morrow\", \"postgres\", \"secret\");' 2>/dev/null; do echo 'Waiting for Postgres...'; sleep 1; done; if [ ! -d vendor ] || [ ! -f vendor/autoload.php ]; then composer install --no-dev --optimize-autoloader; fi && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: 2morrow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
